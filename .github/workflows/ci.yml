name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
      - upstream-master-mirror

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
      plugin-version: ${{ steps.metadata.outputs.plugin-version }}
      has-e2e: ${{ steps.check-for-e2e.outputs.has-e2e }}
      has-backend: ${{ steps.check-for-backend.outputs.has-backend }}
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Unit tests
        run: yarn test:ci
      - name: Build frontend
        run: yarn build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest
          args: ./...

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          args: buildAll

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          args: test

      - name: Check for E2E
        id: check-for-e2e
        run: |
          if [ -f "playwright.config.ts" ]
          then
            echo "has-e2e=true" >> $GITHUB_OUTPUT
          fi

      - name: Sign plugin
        run: yarn sign
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}

      - name: Get plugin metadata
        id: metadata
        run: |
          sudo apt-get install jq

          export GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          export GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip

          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT

      - name: Package plugin
        id: package-plugin
        run: |
          mv dist ${PLUGIN_ID}
          zip ${ARCHIVE} ${PLUGIN_ID} -r
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}

      - name: Check plugin.json
        run: |
          docker run --pull=always \
            -v $PWD/${ARCHIVE}:/archive.zip \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}

      - name: Archive Build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.plugin-id }}-${{ steps.metadata.outputs.plugin-version }}
          path: ${{ steps.metadata.outputs.plugin-id }}
          retention-days: 5

  resolve-versions:
    name: Resolve e2e images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    needs: build
    if: ${{ needs.build.outputs.has-e2e == 'true' }}
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@e2e-version/v2.0.0

  playwright-tests:
    needs: [resolve-versions, build]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    name: e2e test ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download plugin
        uses: actions/download-artifact@v8
        with:
          path: dist
          name: ${{ needs.build.outputs.plugin-id }}-${{ needs.build.outputs.plugin-version }}

      - name: Execute permissions on binary
        if: needs.build.outputs.has-backend == 'true'
        run: |
          chmod +x ./dist/gpx_*

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dev dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Grafana base image
        # nightly is a moving tag, caching it would pin stale builds
        if: matrix.GRAFANA_IMAGE.VERSION != 'nightly'
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache/grafana-image.tar
          key: grafana-base-image-${{ matrix.GRAFANA_IMAGE.NAME }}-${{ matrix.GRAFANA_IMAGE.VERSION }}

      - name: Load cached Grafana base image
        if: ${{ steps.docker-cache.outputs.cache-hit == 'true' }}
        run: docker load -i /tmp/docker-cache/grafana-image.tar

      # docker compose has no top-level `image:` for this service (it's build-only),
      # so `docker compose pull` never fetches it and buildkit doesn't leave the FROM
      # base image locally tagged -- pull it ourselves so `docker save` below has a
      # reference to find, and so the compose build reuses it instead of the daemon
      # implicitly fetching it mid-build.
      - name: Pull Grafana base image
        if: ${{ steps.docker-cache.outputs.cache-hit != 'true' }}
        run: docker pull grafana/${{ matrix.GRAFANA_IMAGE.NAME }}:${{ matrix.GRAFANA_IMAGE.VERSION }}

      - name: Export Grafana base image for cache
        # nightly is a moving tag, caching it would pin stale builds
        if: ${{ matrix.GRAFANA_IMAGE.VERSION != 'nightly' && steps.docker-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/docker-cache
          docker save grafana/${{ matrix.GRAFANA_IMAGE.NAME }}:${{ matrix.GRAFANA_IMAGE.VERSION }} -o /tmp/docker-cache/grafana-image.tar

      - name: Start Grafana
        run: |
          docker compose pull
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} docker compose up -d

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.0.2
        with:
          url: http://localhost:3000/login

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Browsers
        run: yarn exec playwright install chromium --with-deps

      - name: Run Playwright tests
        id: run-tests
        run: yarn e2e --reporter=list,html

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v7
        if: ${{ always() && !cancelled() }}
        with:
          name: smoke-screenshots-${{ matrix.GRAFANA_IMAGE.NAME }}-${{ matrix.GRAFANA_IMAGE.VERSION }}
          path: test-results/screenshots/
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload e2e test summary
        uses: grafana/plugin-actions/playwright-gh-pages/upload-report-artifacts@upload-report-artifacts/v1.0.1
        if: ${{ always() && !cancelled() }}
        with:
          upload-report: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-outcome: ${{ steps.run-tests.outcome }}

      - name: Docker logs
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: |
          docker logs esnet-matrix-panel >& grafana-server.log

      - name: Stop grafana docker
        run: docker compose down

      # Uncomment this step to upload the server log to Github artifacts. Remember Github artifacts are public on the Internet if the repository is public.
      # - name: Upload server log
      #   uses: actions/upload-artifact@v4
      #   if: ${{ always() && steps.run-tests.outcome == 'failure' }}
      #   with:
      #     name: ${{ matrix.GRAFANA_IMAGE.NAME }}-v${{ matrix.GRAFANA_IMAGE.VERSION }}-${{github.run_id}}-server-log
      #     path: grafana-server.log
      #     retention-days: 5

  pr-screenshot-diff:
    name: Before/after panel screenshots
    if: ${{ github.event_name == 'pull_request' && needs.build.outputs.has-e2e == 'true' }}
    needs: build
    # Two full install+build+docker+e2e cycles (before and after) in one job;
    # 15 minutes left no margin even in the best case, and none at all if a
    # runner is briefly slow. 25 gives real headroom without masking a hang.
    timeout-minutes: 25
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Pinned to a single version for reviewer illustration, not cross-version
      # regression coverage (that's what the playwright-tests matrix is for).
      GRAFANA_VERSION: '12.4.0'
      GRAFANA_IMAGE: grafana-enterprise
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Browsers
        run: yarn exec playwright install chromium --with-deps

      - name: Cache Grafana base image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache/grafana-image.tar
          key: grafana-base-image-${{ env.GRAFANA_IMAGE }}-${{ env.GRAFANA_VERSION }}

      - name: Load cached Grafana base image
        if: ${{ steps.docker-cache.outputs.cache-hit == 'true' }}
        run: docker load -i /tmp/docker-cache/grafana-image.tar

      # docker compose has no top-level `image:` for this service (it's build-only),
      # so `docker compose pull` never fetches it and buildkit doesn't leave the FROM
      # base image locally tagged -- pull it ourselves so `docker save` below has a
      # reference to find, and so the compose build reuses it instead of the daemon
      # implicitly fetching it mid-build.
      - name: Pull Grafana base image
        if: ${{ steps.docker-cache.outputs.cache-hit != 'true' }}
        run: docker pull grafana/${{ env.GRAFANA_IMAGE }}:${{ env.GRAFANA_VERSION }}

      - name: Export Grafana base image for cache
        if: ${{ steps.docker-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/docker-cache
          docker save grafana/${{ env.GRAFANA_IMAGE }}:${{ env.GRAFANA_VERSION }} -o /tmp/docker-cache/grafana-image.tar

      - name: Resolve merge base
        id: merge-base
        run: echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> $GITHUB_OUTPUT

      - name: Capture "before" screenshots
        run: |
          git checkout ${{ steps.merge-base.outputs.sha }}
          # The smoke spec(s) are the instrument capturing this screenshot, not
          # part of what's being compared -- restore them from the PR head so
          # a PR that adds its first e2e test still has something to run here.
          git checkout ${{ github.sha }} -- tests/
          yarn install --ignore-engines
          yarn build
          docker compose pull
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ env.GRAFANA_VERSION }} GRAFANA_IMAGE=${{ env.GRAFANA_IMAGE }} docker compose up -d

      - name: Wait for grafana server (before)
        uses: grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.0.2
        with:
          url: http://localhost:3000/login

      - name: Run smoke specs (before)
        # The "before" checkout is the PR's merge-base -- it's expected to fail
        # whatever the PR is fixing, that's the point of capturing it. Don't let
        # that fail the job; the "after" run below is what must actually pass.
        continue-on-error: true
        run: yarn e2e --reporter=list,html

      - name: Save "before" screenshots
        run: |
          mkdir -p before-after/before
          cp -r test-results/screenshots/. before-after/before/
          docker compose down

      - name: Capture "after" screenshots
        run: |
          git checkout ${{ github.sha }}
          yarn install --ignore-engines
          yarn build
          docker compose pull
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ env.GRAFANA_VERSION }} GRAFANA_IMAGE=${{ env.GRAFANA_IMAGE }} docker compose up -d

      - name: Wait for grafana server (after)
        uses: grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.0.2
        with:
          url: http://localhost:3000/login

      - name: Run smoke specs (after)
        run: yarn e2e --reporter=list,html

      - name: Save "after" screenshots
        run: |
          mkdir -p before-after/after
          cp -r test-results/screenshots/. before-after/after/
          docker compose down

      - name: Generate before/after comparison page
        run: |
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8">'
            echo '<title>Before/after screenshots - run '"${GITHUB_RUN_NUMBER}"'</title>'
            echo '<style>'
            echo 'body{font-family:sans-serif;margin:2rem;}'
            echo 'table{border-collapse:collapse;width:100%;}'
            echo 'th,td{border:1px solid #ccc;padding:.5rem;text-align:center;vertical-align:top;}'
            echo 'img{max-width:100%;height:auto;}'
            echo '</style></head><body>'
            echo "<h1>Before/after panel screenshots &mdash; run ${GITHUB_RUN_NUMBER}</h1>"
            echo "<p>Commit <code>${GITHUB_SHA}</code></p>"
            echo '<table><thead><tr><th>Screenshot</th><th>Before</th><th>After</th></tr></thead><tbody>'
            for name in $(ls before-after/before/ before-after/after/ 2>/dev/null | sort -u); do
              before_cell="<em>n/a</em>"
              after_cell="<em>n/a</em>"
              label="${name}"
              if [ -f "before-after/before/${name}" ]; then
                before_cell="<img src=\"before/${name}\">"
              else
                label="${name} <em>(new)</em>"
              fi
              if [ -f "before-after/after/${name}" ]; then
                after_cell="<img src=\"after/${name}\">"
              fi
              echo "<tr><td>${label}</td><td>${before_cell}</td><td>${after_cell}</td></tr>"
            done
            echo '</tbody></table></body></html>'
          } > before-after/index.html

      - name: Upload before/after screenshots
        uses: actions/upload-artifact@v7
        if: ${{ always() && !cancelled() }}
        with:
          name: before-after-screenshots
          path: before-after/
          retention-days: 5
          if-no-files-found: ignore

  publish-report:
    if: ${{ always() && !cancelled() }}
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    needs: [playwright-tests, pr-screenshot-diff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # the deploy-report-pages action injects its own github-token auth;
          # persisting credentials here too causes a duplicate Authorization
          # header and a 400 from GitHub on the action's internal checkout.
          persist-credentials: false
      - name: Publish report
        uses: grafana/plugin-actions/playwright-gh-pages/deploy-report-pages@deploy-report-pages/v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download before/after screenshots
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: before-after-screenshots
          path: before-after

      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: true

      - name: Publish before/after comparison and rebuild index
        run: |
          set -e
          cd gh-pages

          DATE_DIR="$(date -u +%Y%m%d)"
          RUN_DIR="${{ github.run_number }}"

          if [ -f ../before-after/index.html ]; then
            mkdir -p "${DATE_DIR}/${RUN_DIR}/before-after"
            cp -r ../before-after/. "${DATE_DIR}/${RUN_DIR}/before-after/"
          fi

          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8">'
            echo '<title>esnet-matrix-panel e2e reports</title>'
            echo '<style>'
            echo 'body{font-family:sans-serif;margin:2rem;}'
            echo 'ul{padding-left:1.2rem;}'
            echo 'h2{margin-top:2rem;}'
            echo '</style></head><body>'
            echo '<h1>esnet-matrix-panel e2e reports</h1>'
            for date_dir in $(find . -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | sort -r); do
              date_name=$(basename "$date_dir")
              echo "<h2>${date_name}</h2>"
              for run_dir in $(find "$date_dir" -mindepth 1 -maxdepth 1 -type d | sort -rn); do
                run_name=$(basename "$run_dir")
                echo "<h3>Run ${run_name}</h3><ul>"
                for report_dir in $(find "$run_dir" -mindepth 1 -maxdepth 1 -type d | sort); do
                  report_name=$(basename "$report_dir")
                  if [ "$report_name" = "before-after" ]; then
                    echo "<li><a href=\"${date_name}/${run_name}/before-after/\">Before/after comparison</a></li>"
                  else
                    echo "<li><a href=\"${date_name}/${run_name}/${report_name}/\">${report_name}</a></li>"
                  fi
                done
                echo '</ul>'
              done
            done
            echo '</body></html>'
          } > index.html

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if [ -f ../before-after/index.html ]; then
            git add "${DATE_DIR}/${RUN_DIR}/before-after"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish before/after comparison and rebuild index (run ${RUN_DIR})"
            for attempt in 1 2 3 4 5; do
              if git push origin gh-pages; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::failed to push to gh-pages after ${attempt} attempts"
                exit 1
              fi
              sleep $((attempt * 3))
              git fetch origin gh-pages
              git rebase origin/gh-pages
            done
          fi

      - name: Link report in job summary
        run: |
          DATE_DIR="$(date -u +%Y%m%d)"
          RUN_DIR="${{ github.run_number }}"
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${OWNER_LOWER}.github.io/${REPO_NAME}"
          {
            echo "### Playwright report"
            echo "- [Report index](${BASE_URL}/)"
            echo "- [This run's reports (${DATE_DIR}/${RUN_DIR})](${BASE_URL}/${DATE_DIR}/${RUN_DIR}/)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR with before/after report link
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const hasBeforeAfter = fs.existsSync('before-after/index.html');
            if (!hasBeforeAfter) return;

            const dateDir = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const runDir = context.runNumber;
            const ownerLower = context.repo.owner.toLowerCase();
            const baseUrl = `https://${ownerLower}.github.io/${context.repo.repo}`;
            const reportUrl = `${baseUrl}/${dateDir}/${runDir}/before-after/`;
            const marker = '<!-- before-after-report-comment -->';
            const body = `${marker}\n### Before/after panel screenshots\n[View this run's comparison](${reportUrl})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
